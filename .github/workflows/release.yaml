name: Release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      tag:
        description: Tag name, e.g. 0.8.0
        default:
        required: true
      version-replace:
        description: Version to be replaced in bundle, e.g. 0.7.3
        default:
        required: true

jobs:
  build:
    name: Upload Release Asset
    permissions:
      contents: write
      pull-requests: write
      issues: write

    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Login to Quay
      #   uses: docker/login-action@v2
      #   with:
      #     registry: quay.io/sustainable_computing_io
      #     username: ${{ secrets.BOT_NAME }}
      #     password: ${{ secrets.BOT_TOKEN }}

      - name: Update the VERSION
        run: |
          echo "$VERSION" > VERSION
        env:
          VERSION: ${{ github.event.inputs.tag }}

      - name: Install all tools
        uses: ./.github/tools-cache

      # - name: Build Operator
      #   run: |
      #     make operator-build
      #   env:
      #     IMG_BASE: ${{ vars.IMG_BASE }}

      - name: Build Bundle
        run: |
          make bundle bundle-build
        env:
          IMG_BASE: ${{ vars.IMG_BASE }}
          VERSION_REPLACED: ${{ github.event.inputs.version-replace }}

      # - name: Commit bundle changes and tag it
      #   run: |
      #     git add VERSION bundle
      #     git commit -m "ci: update VERSION to $VERSION"
      #     git tag -a "v$VERSION" -m "$VERSION"
      #     git show --stat
      #   env:
      #     VERSION: ${{ github.event.inputs.tag }}
      - name: Git set user
        run: |
          git config  user.name "$USERNAME"
          git config  user.email "$USERNAME-[bot]@users.noreply.github.com"
        env:
          USERNAME: ${{ github.actor }}

      - name: Tag the release
        run: |
          git tag -a "v${{ github.event.inputs.tag }}" -m "v${{ github.event.inputs.tag }}"
          git show --stat

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update VERSION to ${{ github.event.inputs.tag }}"
          committer: github-actions[bot] <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: true
          branch: chore-version-${{ github.event.inputs.tag }}
          delete-branch: true
          title: 'chore: update VERSION to ${{ github.event.inputs.tag }}'
          body: |
            Update VERSION to ${{ github.event.inputs.tag }}

            This is an automated PR to update the VERSION to ${{ github.event.inputs.tag }}
          labels: |
            chore
          assignees: vprashar2929
          reviewers: vprashar2929
          draft: false

      # - name: Push Images
      #   run: |
      #     make operator-push  bundle-push
      #   env:
      #     IMG_BASE: ${{ vars.IMG_BASE }}

      - name: Push Release tag
        run: |
          git push --tags

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.tag }}
          name: release-${{github.event.inputs.tag}}
          generate_release_notes: true
          draft: false
          prerelease: false

  create-release-branch:
    name: Create release branch
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Create release branch
        uses: peterjgrainger/action-create-branch@v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: release-${{github.event.inputs.tag}}
          sha: ${{ github.event.pull_request.head.sha }}
